<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Ninto Clinic App</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      body.embedded #simbar, body.embedded .page-note { display: none; }
      .page-note { font-size: 12px; color: var(--muted); padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--divider); }
      .shell { display: flex; min-height: calc(100vh - 40px); }
      body.embedded .shell { min-height: 100vh; }
      .side { width: 200px; background: var(--chrome); color: #fff; padding: 16px 10px; flex: none; display: flex; flex-direction: column; gap: 4px; }
      .side .brand { font-size: 18px; font-weight: 800; padding: 0 10px 2px; }
      .side .clinic { font-size: 12px; opacity: .7; padding: 0 10px 16px; }
      .side .nav { padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,.75); cursor: pointer; }
      .side .nav.on { background: rgba(255,255,255,.14); color: #fff; }
      .side .gw { margin-top: auto; font-size: 11px; opacity: .75; padding: 10px; line-height: 1.45; }
      .main { flex: 1; min-width: 0; padding: 20px 24px 60px; display: flex; flex-direction: column; gap: 16px; }
      @media (max-width: 760px) {
        .shell { flex-direction: column; }
        .side { width: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px; }
        .side .clinic, .side .gw { display: none; }
        .main { padding: 16px; }
      }
      h1 { font-size: 20px; margin: 0; }
      .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
      .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
      .chip .n { font-weight: 700; opacity: .65; margin-left: 4px; }
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .seg button { border: none; background: #fff; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
      .seg button.on { background: var(--accent-soft); color: var(--accent-dark); }
      .datenav { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
      .datenav button { border: 1px solid var(--border); background: #fff; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; }

      .serving { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .serving .big { font-size: 28px; font-weight: 800; color: var(--accent-dark); min-width: 44px; }
      .serving .meta { flex: 1; min-width: 180px; }
      .serving .t { font-size: 15px; font-weight: 700; }
      .serving .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
      .stats { display: flex; gap: 18px; font-size: 12px; color: var(--muted); }
      .stats b { display: block; font-size: 16px; color: var(--ink); }

      .group-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--faint); text-transform: uppercase; margin: 6px 0 -6px; }
      .qrow { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
      .qrow.serving-row { border: 2px solid var(--accent); padding: 11px 13px; }
      .qrow.reserved-row { border-color: var(--warn-border); background: #FFFCF5; }
      .qrow.dim { opacity: .65; }
      .qrow .when { font-size: 13px; font-weight: 700; }
      .qrow .tok { font-size: 11px; color: var(--faint); margin-top: 2px; }
      .qrow .tok b { font-size: 18px; color: var(--accent-dark); display: block; }
      .qrow .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .qrow .who .n { font-size: 15px; font-weight: 700; }
      .qrow .info { font-size: 12.5px; color: var(--text-2); margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
      .qrow .info .muted { color: var(--faint); }
      .qrow .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .qrow details { margin-top: 8px; font-size: 12px; color: var(--muted); }
      .qrow details .line { padding: 2px 0; }

      .cal { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      .cal .slotrow { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--divider); font-size: 13px; }
      .cal .slotrow:last-child { border-bottom: none; }
      .cal .slotrow.free { cursor: pointer; }
      .cal .slotrow.free:hover { background: var(--tint); }
      .cal .slotrow.past { color: var(--faint); }
      .cal .time { font-weight: 700; }

      .plist { display: flex; flex-direction: column; gap: 10px; }
      .pcard { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
      .pcard .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
      .pcard .n { font-weight: 700; font-size: 15px; }
      .pcard .s { font-size: 12.5px; color: var(--muted); }
      .pcard .appt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; padding-top: 6px; border-top: 1px solid var(--divider); }

      .form { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 16px; max-width: 640px; }
      .form h2 { font-size: 13px; letter-spacing: .06em; color: var(--faint); margin: 6px 0 -6px; text-transform: uppercase; }
      .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 560px) { .form .two { grid-template-columns: 1fr; } }

      .modal-bg { position: fixed; inset: 0; background: rgba(18,36,27,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
      .modal { background: #fff; border-radius: 14px; width: 460px; max-width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
      .modal .mh { display: flex; justify-content: space-between; align-items: center; }
      .modal .mh .t { font-size: 17px; font-weight: 700; }
      .modal .x { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); }
      .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .opt { border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; background: #fff; }
      .opt.on { border: 2px solid var(--accent); background: var(--tint); padding: 9px 5px; color: var(--accent-dark); }
      .opt.off { opacity: .45; cursor: not-allowed; }
      .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .slots .opt { padding: 8px 0; font-size: 12px; }
      .log { font-family: var(--mono); font-size: 11px; color: var(--muted); max-height: 180px; overflow-y: auto; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    </style>
  </head>
  <body>
    <div id="simbar"></div>
    <div class="page-note">Ninto clinic app: appointment flow POC. Open the <a href="../patient/">patient app</a> in another tab or use the <a href="../">split view</a>.</div>
    <div class="shell">
      <nav class="side" id="side"></nav>
      <main class="main" id="main"></main>
    </div>
    <div id="modal"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
