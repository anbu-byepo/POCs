<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Ninto Connect, Publish, Measure -- prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #EDEBE6; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 48px; }
  .page-head { max-width: 620px; text-align: center; margin-bottom: 18px; }
  .page-head h1 { font-size: 16px; margin: 0 0 6px; color: #1a1a1a; }
  .page-head p { font-size: 12px; line-height: 1.55; color: rgba(0,0,0,.55); margin: 0; }
  .quick-nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 760px; margin-bottom: 16px; }
  .quick-nav button { font: inherit; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(0,0,0,.15); background: #fff; color: #1a1a1a; cursor: pointer; }
  .quick-nav button.active { background: #114F3C; color: #fff; border-color: #114F3C; }
  .quick-nav .sep { width: 1px; background: rgba(0,0,0,.15); margin: 0 4px; }
  .frame { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .frame-analytics { width: 375px; height: 940px; font-family: Figtree, system-ui, sans-serif; }
  .frame-publish { width: 372px; height: 786px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .toggle { width: 44px; height: 26px; border-radius: 13px; padding: 3px; display: flex; cursor: pointer; transition: .15s; }
  .toggle-knob { width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  [data-nav], [data-drill], [data-qnav], [data-section], [data-home] { cursor: pointer; }
  .home { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 680px; }
  .home-card { width: 280px; background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 14px; padding: 20px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .home-card h2 { font-size: 15px; margin: 0 0 8px; color: #1a1a1a; }
  .home-card p { font-size: 12px; line-height: 1.55; color: rgba(0,0,0,.6); margin: 0; }
  .home-card .tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #E4F2E4; color: #1F5B3A; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="page-head" id="page-head"></div>
<div class="quick-nav" id="quick-nav"></div>
<div class="home" id="home"></div>
<div class="frame-wrap" id="frame-wrap" style="display:none">
  <div class="frame" id="frame"></div>
</div>

<script>
const BADGE_BASE = 'font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;flex:none;white-space:nowrap;';
const BADGE = {
  Ninto: BADGE_BASE + 'background:#E4F2E4;color:#1F5B3A',
  YouTube: BADGE_BASE + 'background:#FDECEA;color:#C0392B',
  Instagram: BADGE_BASE + 'background:#F5EAF6;color:#8E3E9B',
  LinkedIn: BADGE_BASE + 'background:#E9F0FA;color:#25588F'
};

const POSTS = [
  { title: 'Why your thyroid numbers can be "normal" and you can still feel terrible', source: 'Ninto', date: '28 Mar 2026', views: '1.6K', saves: '84', replies: '12', conv: '31', out: 0, thumbLabel: '', dark: false },
  { title: 'PCOS Insulin Resistance Explained', source: 'YouTube', date: '14 Apr 2026', views: '12.4K', saves: '318', replies: '89', conv: '96', out: 412, thumbLabel: '3:24', dark: true },
  { title: 'The lab panel I actually order before a PCOS diagnosis', source: 'Ninto', date: '9 Apr 2026', views: '2.9K', saves: '204', replies: '37', conv: '44', out: 0, thumbLabel: '', dark: false },
  { title: 'Reversing an HbA1c of 6.8 without aggressive medication', source: 'Instagram', date: '2 Apr 2026', views: '8.1K', saves: '96', replies: '54', conv: '18', out: 188, thumbLabel: '0:58', dark: true },
  { title: 'Three things care seekers ask me about thyroid medication timing', source: 'Ninto', date: '27 Mar 2026', views: '1.2K', saves: '61', replies: '19', conv: '12', out: 0, thumbLabel: '', dark: false },
  { title: 'What continuous glucose monitoring shows that a fasting test misses', source: 'LinkedIn', date: '21 Mar 2026', views: '4.4K', saves: '52', replies: '23', conv: '9', out: 96, thumbLabel: '', dark: false }
];
const SORTS = { Conversions: 'conv', Views: 'viewsN', Revenue: 'rev' };

const ANALYTICS_SCREEN_LABEL = { '1a':'1a Overview','1b':'1b Platforms','1c':'1c All posts','1d':'1d Post detail','1e':'1e Link perf.','1i':'1i YT links','1f':'1f Revenue','1g':'1g Top performing' };
const ANALYTICS_SCREEN_ORDER = ['1a','1b','1c','1d','1e','1i','1f','1g'];

const analyticsState = { screen: '1a', period: '30d', filter: 'All', sort: 'Conversions' };

function tabStyle(active) {
  return 'padding:7px 15px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;'
    + (active ? 'background:#fff;color:#114F3C' : 'background:rgba(255,255,255,.14);color:rgba(255,255,255,.8)');
}
function chipStyle(active) {
  return 'padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;'
    + (active ? 'background:#114F3C;color:#fff;border:1px solid #114F3C' : 'background:#fff;color:#4B5563;border:1px solid #E5E7EB');
}
function segStyle(active) {
  return 'flex:1;padding:8px 6px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;'
    + (active ? 'background:#fff;color:#114F3C;box-shadow:0 1px 2px rgba(0,0,0,.12)' : 'background:transparent;color:#6B7280');
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

function analyticsComputeVals() {
  const period = analyticsState.period;
  const roll = {
    '7d': { reach: '31.2K', reachDelta: '12%', engagement: '2.1K', conversions: '48', outbound: '1,480' },
    '30d': { reach: '128.4K', reachDelta: '18%', engagement: '9.2K', conversions: '214', outbound: '6,240' },
    '90d': { reach: '341.7K', reachDelta: '9%', engagement: '24.6K', conversions: '588', outbound: '17,910' }
  }[period];
  const sparkSets = {
    '7d': [42, 58, 36, 71, 88, 64, 96],
    '30d': [30, 44, 38, 62, 51, 70, 58, 82, 66, 91, 74, 60, 88, 100],
    '90d': [22, 34, 48, 40, 58, 66, 52, 74, 86, 70, 92, 80, 96, 100]
  };
  const spark = sparkSets[period].map((h, i, a) => ({ height: h, last: i === a.length - 1 }));

  const posts = POSTS.map(p => ({ ...p, badge: BADGE[p.source], outText: p.out ? '↗ ' + p.out + ' clicks Ninto sent to ' + p.source : '' }));
  const filter = analyticsState.filter;
  const visiblePosts = filter === 'All' ? posts : posts.filter(p => p.source === filter);

  const topSource = [
    { title: 'PCOS Insulin Resistance Explained', source: 'YouTube', date: '14 Apr', conv: 96, viewsN: 12400, rev: 144000, out: 412, tags: ['PCOS', 'Insulin resistance'] },
    { title: 'The lab panel I actually order before a PCOS diagnosis', source: 'Ninto', date: '9 Apr', conv: 44, viewsN: 2900, rev: 66000, out: 0, tags: ['PCOS', 'Care seeker education'] },
    { title: 'Why your thyroid numbers can be "normal" and you can still feel terrible', source: 'Ninto', date: '28 Mar', conv: 31, viewsN: 1600, rev: 46500, out: 0, tags: ['Thyroid'] },
    { title: 'Reversing an HbA1c of 6.8 without aggressive medication', source: 'Instagram', date: '2 Apr', conv: 18, viewsN: 8100, rev: 27000, out: 188, tags: ['Type 2 diabetes'] },
    { title: 'What continuous glucose monitoring shows that a fasting test misses', source: 'LinkedIn', date: '21 Mar', conv: 9, viewsN: 4400, rev: 13500, out: 96, tags: ['Monitoring'] }
  ];
  const sortKey = SORTS[analyticsState.sort];
  const fmtViews = n => n >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(n);
  const fmtRev = n => '₹' + (n / 1000).toFixed(0) + 'K';
  const topRanked = [...topSource].sort((a, b) => b[sortKey] - a[sortKey]).map((t, i) => ({
    ...t, rank: i + 1, badge: BADGE[t.source],
    primary: analyticsState.sort === 'Views' ? fmtViews(t.viewsN) : analyticsState.sort === 'Revenue' ? fmtRev(t.rev) : String(t.conv),
    primaryLabel: analyticsState.sort === 'Views' ? 'VIEWS' : analyticsState.sort === 'Revenue' ? 'REVENUE' : 'CONV.',
    secondary: (analyticsState.sort === 'Conversions' ? fmtViews(t.viewsN) + ' views' : t.conv + ' conversions') + (t.out ? ' · ↗ ' + t.out : '')
  }));
  const sortNote = {
    Conversions: 'Default ranking. Reach is a means, not the outcome.',
    Views: 'Ranked by reach across Ninto and home platforms.',
    Revenue: 'Ranked by booking value attributed within 7 days.'
  }[analyticsState.sort];

  return { periodLabel: { '7d': 'LAST 7 DAYS', '30d': 'LAST 30 DAYS', '90d': 'LAST 90 DAYS' }[period], roll, spark, visiblePosts, topRanked, sortNote };
}

function backHeader(title, backTarget) {
  return `<div style="padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #EDEDED">
    <span data-nav="${backTarget}" style="font-size:17px;color:#159A4B">&#8592;</span>
    <span style="font-size:16px;font-weight:600;color:#171717">${title}</span>
  </div>`;
}

const ANALYTICS_SCREENS = {
  '1a': (v) => `
    <div style="background:#114F3C;color:#fff;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px;flex:none">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-size:17px">&#8592;</span><span style="font-size:17px;font-weight:600">Analytics</span></div>
        <span style="font-size:17px;opacity:.85">&#8942;</span>
      </div>
      <div style="display:flex;gap:6px">${['7d','30d','90d'].map(l => `<button type="button" data-period="${l}" style="${tabStyle(analyticsState.period===l)}">${l}</button>`).join('')}</div>
    </div>
    <div style="flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div style="padding:16px 16px 14px;border-bottom:1px solid #EDEDED">
        <div style="font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#6B7280">TOTAL REACH &middot; ${v.periodLabel}</div>
        <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px"><span style="font-size:38px;font-weight:700;color:#171717;letter-spacing:-.02em">${v.roll.reach}</span><span style="font-size:12.5px;font-weight:600;color:#159A4B">&#9650; ${v.roll.reachDelta}</span></div>
        <div style="display:flex;align-items:flex-end;gap:4px;height:36px;margin-top:12px">${v.spark.map(bar => `<div style="flex:1;border-radius:2px 2px 0 0;height:${bar.height}%;background:${bar.last ? '#159A4B' : '#DCE3DA'}"></div>`).join('')}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #EDEDED">
        <div style="padding:16px;border-right:1px solid #EDEDED"><div style="font-size:26px;font-weight:700;color:#171717">${v.roll.engagement}</div><div style="font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#6B7280;margin-top:3px">ENGAGEMENT</div><div style="font-size:11.5px;color:#9CA3AF;margin-top:5px">saves, replies, likes</div></div>
        <div style="padding:16px"><div style="font-size:26px;font-weight:700;color:#159A4B">${v.roll.conversions}</div><div style="font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#6B7280;margin-top:3px">CONVERSIONS</div><div style="font-size:11.5px;color:#9CA3AF;margin-top:5px">follows + bookings</div></div>
      </div>
      <div style="padding:13px 16px;display:flex;align-items:center;gap:12px;background:#F0FAF3;border-bottom:1px solid #EDEDED"><div style="flex:1"><div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:#1F5B3A">&#8599; TRAFFIC NINTO SENT OUT</div><div style="font-size:11.5px;color:#4B5563;margin-top:4px">Care seekers who opened your posts at source</div></div><div style="text-align:right"><div style="font-size:22px;font-weight:700;color:#159A4B">${v.roll.outbound}</div><div style="font-size:10px;font-weight:600;letter-spacing:.05em;color:#6B7280">CLICKS OUT</div></div></div>
      <div style="padding:13px 16px 8px;font-size:11px;font-weight:600;letter-spacing:.07em;color:#6B7280">WHERE IT CAME FROM</div>
      <div style="padding:0 16px 12px;display:flex;flex-direction:column;gap:9px">
        <div style="display:flex;align-items:center;gap:10px"><span style="width:74px;font-size:12.5px;font-weight:500;color:#171717">On Ninto</span><div style="flex:1;height:8px;border-radius:4px;background:#EDEDED;overflow:hidden"><div style="width:38%;height:100%;background:#114F3C"></div></div><span style="width:52px;text-align:right;font-size:12px;font-weight:600;color:#171717">48.6K</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="width:74px;font-size:12.5px;font-weight:500;color:#171717">YouTube</span><div style="flex:1;height:8px;border-radius:4px;background:#EDEDED;overflow:hidden"><div style="width:52%;height:100%;background:#159A4B"></div></div><span style="width:52px;text-align:right;font-size:12px;font-weight:600;color:#171717">66.1K</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="width:74px;font-size:12.5px;font-weight:500;color:#171717">Instagram</span><div style="flex:1;height:8px;border-radius:4px;background:#EDEDED;overflow:hidden"><div style="width:11%;height:100%;background:#7BC49A"></div></div><span style="width:52px;text-align:right;font-size:12px;font-weight:600;color:#171717">13.7K</span></div>
      </div>
      <div style="height:1px;background:#EDEDED"></div>
      ${[
        { icon: 'N', title: 'Ninto post analytics', sub: '38 posts &middot; 48.6K views on Ninto', nav: '1c' },
        { icon: 'P', title: 'Platform analytics', sub: '4 platforms &middot; 79.8K views at source', nav: '1b' },
        { icon: 'L', title: 'Link performance', sub: '4,910 clicks in &middot; 214 conversions', nav: '1e' },
        { icon: '&#8599;', title: 'Traffic Ninto sent out', sub: '6,240 clicks to your platform posts', nav: '1e' },
        { icon: '&#8377;', title: 'Revenue', sub: '123 bookings attributed to content', nav: '1f' },
        { icon: '&#9733;', title: 'Top performing content', sub: 'Ranked by conversions', nav: '1g' }
      ].map(d => `<div data-nav="${d.nav}" style="padding:11px 16px;display:flex;flex:none;align-items:center;gap:12px;border-bottom:1px solid #F3F4F6"><div style="width:34px;height:34px;border-radius:9px;background:#ECEDE7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#114F3C">${d.icon}</div><div style="flex:1"><div style="font-size:13.5px;font-weight:600;color:#171717">${d.title}</div><div style="font-size:11.5px;color:#6B7280;margin-top:2px">${d.sub}</div></div><span style="font-size:13px;color:#9CA3AF">&#8250;</span></div>`).join('')}
    </div>
    <div style="display:flex;border-top:1px solid #EDEDED;padding:8px 0 10px;background:#fff;flex:none">
      <div data-nav="1a" style="flex:1;text-align:center;color:#114F3C"><div style="font-size:15px">&#9737;</div><div style="font-size:9.5px;font-weight:600;margin-top:3px">Home</div></div>
      <div style="flex:1;text-align:center;color:#9CA3AF"><div style="font-size:15px">&#9993;</div><div style="font-size:9.5px;font-weight:600;margin-top:3px">Inbox</div></div>
      <div style="flex:1;text-align:center;color:#9CA3AF"><div style="font-size:15px">&#9638;</div><div style="font-size:9.5px;font-weight:600;margin-top:3px">Schedule</div></div>
      <div style="flex:1;text-align:center;color:#9CA3AF"><div style="font-size:15px">&#9635;</div><div style="font-size:9.5px;font-weight:600;margin-top:3px">Practice</div></div>
      <div style="flex:1;text-align:center;color:#9CA3AF"><div style="font-size:15px">&#9679;</div><div style="font-size:9.5px;font-weight:600;margin-top:3px">Profile</div></div>
    </div>
  `,

  '1b': () => {
    const platforms = [
      { abbr: 'YT', name: 'YouTube', status: 'Synced', ok: true, handle: '@drmeeranair', audience: '24.6K', audienceLabel: 'SUBSCRIBERS', posts: '31', fromNinto: '3,120', sync: '2 hours ago' },
      { abbr: 'IG', name: 'Instagram', status: 'Synced', ok: true, handle: '@dr.meera.endo', audience: '18.2K', audienceLabel: 'FOLLOWERS', posts: '64', fromNinto: '1,840', sync: '4 hours ago' },
      { abbr: 'IN', name: 'LinkedIn', status: 'Needs reauth', ok: false, handle: 'in/meeranair-endo', audience: '7.4K', audienceLabel: 'FOLLOWERS', posts: '12', fromNinto: '760', sync: '6 days ago' },
      { abbr: 'SP', name: 'Spotify Podcast', status: 'Synced', ok: true, handle: 'The Metabolic Hour', audience: '2.1K', audienceLabel: 'LISTENERS', posts: '9', fromNinto: '520', sync: 'Yesterday' }
    ];
    const pill = ok => 'font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;' + (ok ? 'background:#E4F2E4;color:#1F5B3A' : 'background:#FDF0E3;color:#9A5B12');
    return `
    ${backHeader('Connected platforms', '1a')}
    <div style="padding:16px;background:#F7F8F5;border-bottom:1px solid #EDEDED"><div style="font-size:12.5px;color:#4B5563;line-height:1.5">Synced platforms pull performance data every 6 hours and post content into your Ninto feed automatically.</div></div>
    ${platforms.map(p => `
      <div style="padding:15px 16px;border-bottom:1px solid #F3F4F6;display:flex;gap:12px;align-items:flex-start">
        <div style="width:38px;height:38px;border-radius:10px;background:#ECEDE7;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#114F3C">${p.abbr}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:7px"><span style="font-size:14px;font-weight:600;color:#171717">${p.name}</span><span style="${pill(p.ok)}">${p.status}</span></div>
          <div style="font-size:12px;color:#6B7280;margin-top:3px">${p.handle}</div>
          <div style="display:flex;gap:14px;margin-top:8px">
            <div><div style="font-size:14.5px;font-weight:700;color:#171717">${p.audience}</div><div style="font-size:10px;font-weight:600;letter-spacing:.05em;color:#9CA3AF;margin-top:1px">${p.audienceLabel}</div></div>
            <div><div style="font-size:14.5px;font-weight:700;color:#171717">${p.posts}</div><div style="font-size:10px;font-weight:600;letter-spacing:.05em;color:#9CA3AF;margin-top:1px">SYNCED POSTS</div></div>
            <div><div style="font-size:14.5px;font-weight:700;color:#159A4B">${p.fromNinto}</div><div style="font-size:10px;font-weight:600;letter-spacing:.05em;color:#9CA3AF;margin-top:1px">&#8599; FROM NINTO</div></div>
          </div>
          <div style="font-size:11.5px;color:#9CA3AF;margin-top:9px">Last sync ${p.sync}</div>
        </div>
        <span style="font-size:13px;color:#9CA3AF;padding-top:4px">&#8250;</span>
      </div>
    `).join('')}
    <div style="padding:18px 16px"><button type="button" style="width:100%;padding:13px;border-radius:999px;border:1px solid #159A4B;background:#fff;color:#159A4B;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">+ Connect a platform</button><div style="font-size:11.5px;color:#9CA3AF;text-align:center;margin-top:10px">X, Facebook Pages and Spotify available</div></div>
  `; },

  '1c': (v) => `
    <div style="padding:14px 16px 12px;border-bottom:1px solid #EDEDED"><div style="display:flex;align-items:center;gap:12px"><span data-nav="1a" style="font-size:17px;color:#159A4B">&#8592;</span><span style="font-size:16px;font-weight:600;color:#171717">All posts</span><span style="margin-left:auto;font-size:12.5px;font-weight:600;color:#159A4B">Sort: Recent</span></div></div>
    <div style="padding:12px 16px;display:flex;gap:7px;overflow:hidden;border-bottom:1px solid #EDEDED">${['All', 'Ninto', 'YouTube', 'Instagram', 'LinkedIn'].map(l => `<button type="button" data-filter="${l}" style="${chipStyle(analyticsState.filter===l)}">${l}</button>`).join('')}</div>
    <div style="flex:1;overflow:hidden">
      ${v.visiblePosts.map(p => `
        <div data-nav="1d" style="padding:14px 16px;border-bottom:1px solid #F3F4F6;display:flex;gap:12px">
          <div style="width:64px;height:44px;border-radius:8px;flex:none;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font-size:9.5px;font-weight:600;${p.dark ? 'background:#2A2A2A;color:#fff' : 'background:#ECEDE7;color:#8A8F86'}">${p.thumbLabel}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:500;color:#171717;line-height:1.4">${escapeHtml(p.title)}</div>

        <div style="display:flex;align-items:center;gap:12px;padding:13px 16px"><div style="flex:1"><div style="font-size:13.5px;color:#1B1F1D;font-weight:600">Pull content in &amp; push posts out</div><div style="font-size:11px;color:#6B7570;margin-top:2px;line-height:1.45">Granted together when you connected. Turning this off ends the connection.</div></div>${toggleHtml('pmView', publishState.pmView)}</div>
        <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #F1F2F0"><div style="flex:1"><div style="font-size:13.5px;color:#1B1F1D;font-weight:600">Show pulled posts on my profile</div><div style="font-size:11px;color:#6B7570;margin-top:2px">Display setting only &mdash; access stays</div></div>${toggleHtml('pmPost', publishState.pmPost)}</div>

        <div style="display:flex;align-items:center;padding:13px 16px"><div style="flex:1;font-size:13.5px;color:#1B1F1D">Toggle on by default in composer</div>${toggleHtml('pmDef', publishState.pmDef)}</div>
        <div style="display:flex;align-items:center;padding:13px 16px;border-top:1px solid #F1F2F0"><div style="flex:1;font-size:13.5px;color:#1B1F1D">Default hashtags</div><span style="font-size:12.5px;color:#6B7570">#thyroid +2 &rsaquo;</span></div>
        <div style="display:flex;align-items:center;padding:13px 16px;border-top:1px solid #F1F2F0"><div style="flex:1;font-size:13.5px;color:#1B1F1D">Image crop</div><span style="font-size:12.5px;color:#6B7570">4:5 feed &rsaquo;</span></div>
      </div>
      <div style="padding:15px 16px 6px;font-size:12px;font-weight:700;color:#1B1F1D;letter-spacing:.02em">ACTIVITY</div>
      <div style="background:#fff;border-top:1px solid #E6E8E6;border-bottom:1px solid #E6E8E6">
        <div style="display:flex;align-items:center;padding:13px 16px"><div style="flex:1;font-size:13.5px;color:#1B1F1D">Posts sent from Ninto</div><span style="font-size:12.5px;color:#6B7570">34 &rsaquo;</span></div>
        <div style="display:flex;align-items:center;padding:13px 16px;border-top:1px solid #F1F2F0"><div style="flex:1;font-size:13.5px;color:#1B1F1D">Daily limit remaining</div><span style="font-size:12.5px;color:#B4772A">0 of 25</span></div>
      </div>
      <div style="padding:16px"><div data-nav="1n" style="height:44px;border-radius:22px;border:1px solid #F0C9C7;color:#C2352F;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center">Disconnect Instagram</div></div>
    </div>
  `,

  '1n': () => `
    <div style="height:52px;background:#0C5C3D;flex:none"></div>
    <div style="flex:1;position:relative;background:#F7F7F5">
      <div style="padding:15px 16px;opacity:.35;pointer-events:none"><div style="height:40px;background:#fff;border-radius:10px"></div><div style="height:120px;background:#fff;border-radius:10px;margin-top:12px"></div></div>
      <div style="position:absolute;inset:0;background:rgba(20,26,22,.42)"></div>
      <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:20px 18px 22px">
        <div style="width:38px;height:4px;border-radius:2px;background:#DDE0DC;margin:0 auto 18px"></div>
        <div style="font-size:18px;font-weight:700;color:#1B1F1D;line-height:1.3">Disconnect Instagram?</div>
        <div style="font-size:12.5px;color:#6B7570;line-height:1.5;margin-top:7px">Choose what happens to the 18 Instagram posts showing on your Ninto profile.</div>
        <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
          <div data-dc="keep" style="border-radius:12px;padding:13px;display:flex;gap:11px;cursor:pointer;border:${publishState.dc==='keep'?'1.5px solid #17A34A':'1px solid #E6E8E6'};background:${publishState.dc==='keep'?'#F4FBF6':'#fff'}">
            <span style="width:19px;height:19px;border-radius:50%;flex:none;margin-top:1px;border:${publishState.dc==='keep'?'1.5px solid #17A34A':'1.5px solid #C9CEC9'};background:${publishState.dc==='keep'?'#17A34A':'#fff'};color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center">${publishState.dc==='keep'?'&#10003;':''}</span>
            <div><div style="font-size:13.5px;font-weight:600;color:#1B1F1D">Remove the account only</div><div style="font-size:11.5px;color:#6B7570;line-height:1.5;margin-top:3px">The 18 posts already pulled in stay on your Ninto profile as they are. Nothing new is pulled in.</div></div>
          </div>
          <div data-dc="wipe" style="border-radius:12px;padding:13px;display:flex;gap:11px;cursor:pointer;border:${publishState.dc==='wipe'?'1.5px solid #17A34A':'1px solid #E6E8E6'};background:${publishState.dc==='wipe'?'#F4FBF6':'#fff'}">
            <span style="width:19px;height:19px;border-radius:50%;flex:none;margin-top:1px;border:${publishState.dc==='wipe'?'1.5px solid #17A34A':'1.5px solid #C9CEC9'};background:${publishState.dc==='wipe'?'#17A34A':'#fff'};color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center">${publishState.dc==='wipe'?'&#10003;':''}</span>
            <div><div style="font-size:13.5px;font-weight:600;color:#1B1F1D">Remove the account and its posts</div><div style="font-size:11.5px;color:#6B7570;line-height:1.5;margin-top:3px">All 18 Instagram posts come off your Ninto profile. They stay live on Instagram.</div></div>
          </div>

        <div style="margin-top:14px;padding:12px 14px;background:#FDF7EF;border:1px solid #F0D9BC;border-radius:10px;font-size:11.5px;color:#B4772A;line-height:1.5">1 Instagram post is waiting to retry. Disconnecting cancels it.</div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
          <div data-nav="1k" style="height:46px;border-radius:23px;background:#C2352F;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">Disconnect</div>
          <div data-nav="1m" style="height:46px;border-radius:23px;border:1px solid #DDE0DC;color:#1B1F1D;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">Keep connected</div>
        </div>

};


const HOME_HEAD = `<h1>Ninto -- Connect, Publish, Measure (prototype)</h1><p>One app, real URL routes for every screen (refresh/back/forward all work -- try it). Covers two of the design's three chapters: <strong>Publish</strong> (cross-posting to external platforms) and <strong>Measure</strong> (the analytics hub). <strong>Connect</strong> (YouTube OAuth + import) is proven separately as a Node script in <code>../youtube-feasibility/check.mjs</code>, not as a UI here -- see <code>audit/</code> for why. No backend, static mock data.</p>`;
const ANALYTICS_HEAD = `<h1>Measure -- Analytics Hub</h1><p>Tap a drill-down row on the landing screen to go there, Back returns. Period tabs (1a), platform filter (1c), and sort tabs (1g) are live.</p>`;
const PUBLISH_HEAD = `<h1>Publish -- cross-platform posting</h1><p>Real navigation through compose -> also-post-to -> customize -> preview -> publish -> results -> manage, plus platform management. Toggles, tabs and the disconnect choice are live.</p>`;

function currentRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  return { section: parts[0] || null, screenId: parts[1] || null };
}

function showFrame(html, sizeClass) {
  document.getElementById('home').style.display = 'none';
  document.getElementById('frame-wrap').style.display = 'flex';
  document.getElementById('frame-wrap').style.flexDirection = 'column';
  document.getElementById('frame-wrap').style.alignItems = 'center';
  const frame = document.getElementById('frame');
  frame.className = 'frame ' + sizeClass;
  frame.innerHTML = html;
}

function updateQuickNav(section, current) {
  if (!section) { document.getElementById('quick-nav').innerHTML = ''; return; }
  const order = section === 'analytics' ? ANALYTICS_SCREEN_ORDER : PUBLISH_SCREEN_ORDER;
  const label = section === 'analytics' ? ANALYTICS_SCREEN_LABEL : PUBLISH_SCREEN_LABEL;
  const home = `<button data-home>&larr; All flows</button><span class="sep"></span>`;
  const starts = section === 'publish'
    ? `<button data-qnav="1a" class="${current==='1a'?'active':''}">Start: Compose</button><button data-qnav="1k" class="${current==='1k'?'active':''}">Start: Manage platforms</button><span class="sep"></span>`
    : '';
  document.getElementById('quick-nav').innerHTML = home + starts + order.map(id =>
    `<button data-qnav="${id}" class="${id === current ? 'active' : ''}">${label[id]}</button>`
  ).join('');
}

function renderHome() {
  document.getElementById('page-head').innerHTML = HOME_HEAD;
  document.getElementById('quick-nav').innerHTML = '';
  document.getElementById('frame-wrap').style.display = 'none';
  const home = document.getElementById('home');
  home.style.display = 'flex';
  home.innerHTML = `
    <div class="home-card" data-section="analytics">
      <div class="tag">Measure</div>
      <h2>Analytics Hub</h2>
      <p>Overall roll-up, connected platforms, all posts, post detail (Ninto + YouTube-via-API side by side), link performance, revenue, top performing content.</p>
    </div>
    <div class="home-card" data-section="publish">
      <div class="tag">Publish</div>
      <h2>Cross-Post Flow</h2>
      <p>Compose once, post to Ninto + external platforms independently, per-platform results and retry, manage connected platforms.</p>
    </div>
  `;
}

function renderAnalytics(screenId) {
  if (!ANALYTICS_SCREENS[screenId]) { location.hash = '#/analytics/1a'; return; }
  analyticsState.screen = screenId;
  document.getElementById('page-head').innerHTML = ANALYTICS_HEAD;
  const v = analyticsComputeVals();
  showFrame(ANALYTICS_SCREENS[screenId](v), 'frame-analytics');
  updateQuickNav('analytics', screenId);
}

function renderPublish(screenId) {
  if (!PUBLISH_SCREENS[screenId]) { location.hash = '#/publish/1a'; return; }
  publishState.screen = screenId;
  document.getElementById('page-head').innerHTML = PUBLISH_HEAD;
  showFrame(PUBLISH_SCREENS[screenId](), 'frame-publish');
  updateQuickNav('publish', screenId);
  if (screenId === '1g') {
    setTimeout(() => { if (publishState.screen === '1g') location.hash = '#/publish/1h'; }, 1400);
  }
}

function router() {
  const { section, screenId } = currentRoute();
  if (section === 'analytics') { renderAnalytics(screenId || '1a'); return; }
  if (section === 'publish') { renderPublish(screenId || '1a'); return; }
  renderHome();
}

document.addEventListener('click', (event) => {
  const homeLink = event.target.closest('[data-home]');
  if (homeLink) { location.hash = '#/'; return; }

  const sectionCard = event.target.closest('[data-section]');
  if (sectionCard) { location.hash = '#/' + sectionCard.dataset.section + '/1a'; return; }

  const { section } = currentRoute();

  if (section === 'analytics') {
    const period = event.target.closest('[data-period]');
    if (period) { analyticsState.period = period.dataset.period; router(); return; }
    const filter = event.target.closest('[data-filter]');
    if (filter) { analyticsState.filter = filter.dataset.filter; router(); return; }
    const sort = event.target.closest('[data-sort]');
    if (sort) { analyticsState.sort = sort.dataset.sort; router(); return; }
    const qnav = event.target.closest('[data-qnav]');
    if (qnav) { location.hash = '#/analytics/' + qnav.dataset.qnav; return; }
    const nav = event.target.closest('[data-nav]');
    if (nav) { location.hash = '#/analytics/' + nav.dataset.nav; return; }
  }

  if (section === 'publish') {
    const toggle = event.target.closest('[data-toggle]');
    if (toggle) { const k = toggle.dataset.toggle; publishState[k] = !publishState[k]; router(); return; }
    const connect = event.target.closest('[data-connect]');
    if (connect) { publishState.connectTarget = connect.dataset.connect; location.hash = '#/publish/1c'; return; }
    const connectConfirm = event.target.closest('[data-connectconfirm]');
    if (connectConfirm) { publishState[connectConfirm.dataset.connectconfirm] = true; location.hash = '#/publish/1b'; return; }
    const tab = event.target.closest('[data-tab]');
    if (tab) { publishState.tab = tab.dataset.tab; router(); return; }
    const dc = event.target.closest('[data-dc]');
    if (dc) { publishState.dc = dc.dataset.dc; router(); return; }
    const qnav = event.target.closest('[data-qnav]');
    if (qnav) { location.hash = '#/publish/' + qnav.dataset.qnav; return; }
    const nav = event.target.closest('[data-nav]');
    if (nav) { location.hash = '#/publish/' + nav.dataset.nav; return; }
  }
});

window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
