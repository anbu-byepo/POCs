# One Netlify site serves every POC from the repo root, each under its own
# folder (/gbp-feasibility/, /youtube-feasibility/, /analytics-hub/, ...),
# with index.html at the root as the hub linking them. No build step: the
# spikes are static pages (their server.mjs is local-dev only).
#
# A spike's OAuth Web Client must list this site's origin (no path) under
# Authorized JavaScript origins, or Google rejects the popup with
# origin_mismatch.
[build]
  publish = "."

# appointment-flow's Razorpay proxy (needs RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET
# in the site's environment; without them the app uses its simulated gateway)
# appointment-flow's AI arrival call (needs ANTHROPIC_API_KEY; without it the
# patient app plays a scripted call), appointment-flow's Google Maps routes
# (needs GOOGLE_SERVICE_ACCOUNT_JSON, the Maps Provision dev service account's
# key, for OAuth to the Routes API; without it the trip planner estimates),
# appointment-flow's IVR arrival calls on Exotel (needs the EXOTEL_* variables,
# see netlify/functions/exotel.mjs; without them calls are simulated), and
# surepass-prototype's verification proxy (needs SUREPASS_API_KEY). Function
# dependencies (@anthropic-ai/sdk, google-auth-library, @netlify/blobs) come
# from the root package.json.
[functions]
  directory = "netlify/functions"

# The IVR reply/question clips the Exotel function joins and serves.
[functions.exotel]
  included_files = ["appointment-flow/ivr-audio/*.wav"]

# Plans, design sources and editor config live in the repo but aren't meant
# to be served.
[[redirects]]
  from = "/audit/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
